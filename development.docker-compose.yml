
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dapur_ina_aina_app

    restart: unless-stopped

    ports:
      - "3333:3333"

    env_file:
      - .env

    environment:
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      mysql:
        condition: service_healthy

    command: npm run dev -- --host=0.0.0.0

  mysql:
    image: mysql:8.4

    container_name: dapur_ina_aina_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: db_dapur_ina_aina
      MYSQL_USER: dapur_user
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: